# 自构建 Windows 版本（fork 自用）
#
# 为什么不复用官方的 flutter-tag.yml -> flutter-build.yml 链路：
# 那条链依赖 `uses: ./.github/workflows/xxx.yml` 的嵌套 workflow 调用，
# 在 fork 环境下 GitHub 会直接判定 startup_failure（本fork 实测）。
# 本文件把所有步骤内联，避开嵌套调用。
#
# 差异：只构建 Windows x64（不含arm64 / macOS / Linux / Android / iOS / Web）。

name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  # 与官方 vcpkg.json baseline 一致（2026.07.29）
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.5.0"

jobs:
  bridge:
    name: Generate flutter-rust bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install -y \
            clang cmake curl gcc g++ libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: "x86_64-unknown-linux-gnu"
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          # Flutter 3.22.3 下 extended_text 14 需要更新的 Dart，降级以便解析
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          cd flutter && flutter pub get && cd ..

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build:
    name: Build Windows x64
    needs: [bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Verify custom server config
        shell: bash
        run: |
          echo "--- hbb_common server config ---"
          grep -nE "RENDEZVOUS_SERVERS|RS_PUB_KEY|RENDEZVOUS_PORT|RELAY_PORT" \
            libs/hbb_common/src/config.rs | head -8
          echo "--- .gitmodules ---"
          cat .gitmodules

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: "x86_64-pc-windows-msvc"
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Bundle usbmmidd and printer driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found"
          else
            echo "Runner.res: $runner_res"
            cp $runner_res ./libs/portable/Runner.res
          fi

      - name: Build self-extracted single-file executable
        shell: pwsh
        run: |
          # 官方流程里有这一步，之前漏了。用 libs/portable 的 packer 把整个
          # rustdesk 目录用 brotli 压缩内嵌进单个 exe，运行时会自动释放到临时目录。
          # 先去掉 manifest 里的 dpiAware 行（官方 workflow 同样处理）。
          sed -i '/dpiAware/d' res/manifest.xml
          cd libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          cd ../..
          # libs/portable 是 workspace member，cargo 把产物放在仓库根的 target/ 下，
          # 不是 libs/portable/target/。两处都找一遍，兼容不同 cargo 版本行为。
          $packer = @(
            "./target/release/rustdesk-portable-packer.exe",
            "./libs/portable/target/release/rustdesk-portable-packer.exe",
            "./target/x86_64-pc-windows-msvc/release/rustdesk-portable-packer.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $packer) {
            Write-Error "rustdesk-portable-packer.exe not found. Searched:"
            Get-ChildItem -Path . -Recurse -Filter "rustdesk-portable-packer.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Write-Host "Packer found: $packer"
          New-Item -ItemType Directory -Force -Path ./SignOutput | Out-Null
          Copy-Item $packer ./SignOutput/rustdesk-${{ github.ref_name }}-x64.exe

      - name: Verify single-file executable
        shell: pwsh
        run: |
          $exe = Get-Item ./SignOutput/rustdesk-${{ github.ref_name }}-x64.exe
          Write-Host ("Size: {0:N1} MB" -f ($exe.Length / 1MB))
          if ($exe.Length -lt 40MB) {
            Write-Error "Single-file exe is suspiciously small - packing may have failed"
            exit 1
          }
          # 确认打包产物确实内嵌了自建服务器地址。
          # 逐块扫描，避免把整个 40+ MB 文件转成字符串（那会慢到超时）。
          # 每块读1MB+64，但下一次从"已消费位置 - 64"重新开始，
          # 保证跨块边界的短字符串也能被检出。
          $need = [System.Text.Encoding]::ASCII.GetBytes("36.150.231.220")
          $bad  = [System.Text.Encoding]::ASCII.GetBytes("rs-ny.rustdesk.com")
          $needLen = $need.Length; $badLen = $bad.Length
          $overlap = [Math]::Max($needLen, $badLen) - 1
          $foundNew = $false; $foundOld = $false
          $chunk = 1MB
          $buf = New-Object byte[] ($chunk + $overlap)
          $fs = [System.IO.File]::OpenRead($exe.FullName)
          try {
            $carry = 0   #上一块尾部保留的字节数
            while ($true) {
              $n = $fs.Read($buf, $carry, $chunk)
              if ($n -le 0) { break }
              $total = $carry + $n
              $hay = $buf[0..($total-1)]
              $csv = $hay -join ','
              if (-not $foundNew) { $foundNew = $csv -match ($need -join ',') }
              if (-not $foundOld) { $foundOld = $csv -match ($bad  -join ',') }
              if ($foundNew -and $foundOld) { break }
              # 把尾部 overlap 字节挪到开头
              if ($total -ge $overlap) {
                [Array]::Copy($buf, $total - $overlap, $buf, 0, $overlap)
                $carry = $overlap
              } else { $carry = $total }
            }
          } finally { $fs.Close() }
          if (-not $foundNew) { Write-Error "Custom ID server 36.150.231.220 not found in packed exe"; exit 1 }
          if ($foundOld)   { Write-Error "Official server address still present in packed exe"; exit 1 }
          Write-Host "Packed exe contains 36.150.231.220 and no official address - OK"

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: RustDesk ${{ github.ref_name }}
          body: |
            ## RustDesk ${{ github.ref_name }}

            基于 rustdesk/rustdesk 官方源码构建，使用自建服务端。

            ### 服务端配置

            | 项目 | 地址 |
            |---|---|
            | ID 服务器 | `36.150.231.220:21116` |
            | 中继服务器 | `36.150.231.220:21117` |

            客户端已内置上述地址与对应的服务端公钥，无需在设置中手动填写。

            ### 安装

            **下载 `rustdesk-${{ github.ref_name }}-x64.exe` 即可，单文件独立运行，无需安装。**

            首次运行时会把内置文件释放到用户临时目录，之后直接运行该 exe 即可。
            可以把它放在任意目录（如桌面、U 盘），也可右键发送到桌面快捷方式。

            - 架构：Windows x64
            - 需要 Windows 10 及以上

            ### 已知提示

            - 本构建**未做代码签名**，Windows SmartScreen 可能显示未知发布者提示，
              选择"更多信息 → 仍要运行"即可
            - 硬件编解码已启用（`--hwcodec --vram`）
            - 免安装绿色版：如需彻底卸载，删除 exe 即可（另需清理
              `%TEMP%\rustdesk-portable` 下的释放目录）

            ### 说明

            自建服务端需配套的 hbb 服务端（hbbs/hbbr）并使用相同密钥，
            公钥已内置于客户端。
          files: |
            ./SignOutput/rustdesk-${{ github.ref_name }}-x64.exe
